# The gates, on every push. Acceptance never depends on trusting a report:
# whatever a commit message claims, this is what actually ran.
name: Acceptance

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # typecheck, lint, tests, production build — the same command a
      # contributor runs locally, with nothing skipped.
      - name: npm run verify
        run: npm run verify
        env:
          # Never read a vendor's website from CI. The suite must not depend on
          # somebody else's site being up, and a test run is not a reason to
          # send traffic at 3,000 strangers.
          DISABLE_SITE_DETECTION: "1"

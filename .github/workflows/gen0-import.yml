# Generation 0 into production, run here and nowhere else.
#
# Why a workflow rather than someone's laptop: the production credentials live
# in GitHub Secrets, where they can be rotated and audited. A token pasted into
# a chat, a terminal history or an agent transcript cannot be revoked from
# there, so nothing outside this job ever needs to hold them.
#
# The job is manual and refuses to guess. It always scores first, always prints
# what it is about to do, and only writes when the run is dispatched with
# confirm: yes.
name: Generation 0 import

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many recommended profiles to import (0 = all)"
        required: true
        default: "136"
      confirm:
        description: 'Type "yes" to write to production. Anything else is a dry run.'
        required: true
        default: "no"
      enrich_top:
        description: "How many sites to read while scoring"
        required: true
        default: "1200"

# One at a time. Two concurrent imports would race on the same domains.
concurrency:
  group: gen0-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    # Put the credentials in an Environment named "production" so the secrets
    # are scoped to this job and a reviewer can be required later without
    # touching this file.
    environment: production
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The gates, before anything reads a website or writes a row.
      - name: Gates
        run: npm run verify -- --quick

      - name: Fetch the Launch Llama catalogue
        run: npm run launchllama:fetch

      - name: Score for Stackgraph fit
        run: |
          npm run launchllama:score -- \
            --in=data/launchllama.csv \
            --enrich \
            --enrich-top=${{ inputs.enrich_top }} \
            --concurrency=10

      # Always runs, whatever the confirmation says. The log of this step is
      # the record of exactly which domains a write would have touched.
      - name: Dry run
        run: npm run launchllama:import -- --limit=${{ inputs.limit }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}

      - name: Import to production
        if: inputs.confirm == 'yes'
        run: |
          npm run launchllama:import -- \
            --write --remote --confirm-stackgraph-production \
            --limit=${{ inputs.limit }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}

      - name: Say what happened
        if: always()
        run: |
          if [ "${{ inputs.confirm }}" = "yes" ]; then
            echo "Wrote up to ${{ inputs.limit }} UNCLAIMED profiles to production."
          else
            echo "Dry run only. Nothing was written."
            echo 'Re-dispatch with confirm: yes to import.'
          fi
          echo "No relationships, no claims and no notifications are created by an import."

      # Keep the scored file, so a decision about the cohort can be reviewed
      # after the fact rather than trusted.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launchllama-review
          path: data/launchllama-stackgraph-review.csv
          retention-days: 30
